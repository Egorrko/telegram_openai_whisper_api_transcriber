services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.2
    env_file: 
      - .env
    environment:
      - TELEGRAM_LOCAL=true
    restart: always
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  goodsecretarybot:
    build: .
    entrypoint: ./entrypoint.sh
    environment:
      ALL_PROXY: "http://${PROXY_USERNAME}:${PROXY_PASSWORD}@${PROXY_HOST}:${PROXY_PORT}"
      HTTPS_PROXY: "http://${PROXY_USERNAME}:${PROXY_PASSWORD}@${PROXY_HOST}:${PROXY_PORT}"
      HTTP_PROXY: "http://${PROXY_USERNAME}:${PROXY_PASSWORD}@${PROXY_HOST}:${PROXY_PORT}"
    command: uv run src/manage.py runbot
    env_file: 
      - .env
    restart: always
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - ./data:/app/data
    depends_on:
      - telegram-bot-api

volumes:
  telegram-bot-api-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=500m,uid=1000"
